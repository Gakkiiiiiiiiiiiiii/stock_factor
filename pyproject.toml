[project]
name = "stock-factor"
version = "0.1.0"
description = "Quant factor research service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "filelock>=3.15",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
stock-factor-worker = "stock_factor.workers.factor_worker:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
