[project]
name = "stock-factor"
version = "0.1.0"
description = "Quant factor research service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "filelock>=3.15",
  "httpx>=0.27",
  "exchange-calendars>=4.5",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# ``test-core`` deliberately contains no ML runtime.  Keep this profile
# suitable for deterministic research and contract jobs in a CPU-only image.
test-core = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8", "jsonschema>=4.23"]
# Keep the ML runtime separate so importing/running core code does not require
# Torch.  The version floor is shared by CPU and GPU profiles; CI selects the
# CPU wheel for ``ml-cpu`` and deployers select their CUDA index for ``ml-gpu``.
ml-cpu = ["torch>=2.6"]
ml-gpu = ["torch>=2.6"]
# ``test-ml`` is self-contained rather than a self-referential extra.  This
# makes ``pip install -e '.[test-ml]'`` reliable from a source checkout.
test-ml = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "jsonschema>=4.23",
  "pandas>=2.2",
  "pyarrow>=14",
  "torch>=2.6",
  "safetensors>=0.8",
  "pyqlib==0.9.7",
]
# Backward-compatible aliases retained for existing local and deployment jobs.
test = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.8", "jsonschema>=4.23"]
postgres = ["psycopg[binary]>=3.2"]
technical = [
  "pandas>=2.2",
  "pyarrow>=14",
  "torch>=2.6",
  "safetensors>=0.8",
  "pyqlib==0.9.7",
]

[project.scripts]
stock-factor-worker = "stock_factor.workers.factor_worker:main"
stock-factor = "stock_factor.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
