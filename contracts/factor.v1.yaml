# factor.v1 Contract（设计文档 §14）
# Producer: stock_factor   Consumers: stock_agent（FactorSpecialist）
contract_version: factor.v1
service: stock_factor
endpoints:
  - name: list_factors
    method: GET
    path: /api/v1/factors
  - name: get_factor
    method: GET
    path: /api/v1/factors/{factor_id}
    returns: [formula, status, RankIC, ICIR, OOS, lifecycle, capacity, exposure,
              tradability_assessment, tradability_assessment_hash, gross_metrics, net_metrics]
  - name: alpha_score
    method: POST
    path: /api/v1/alpha/score
    description: On-demand Alpha Score（§14.2）
    request:
      symbols: { type: array, items: string, required: true }
      as_of: { type: date, required: false }
      factor_set: { type: string, default: production }
    response:
      data:
        factor_set_id: { type: string, pattern: "fs-<hash16>", description: "详细修改方案 §11 FactorSet 正式身份" }
        factor_set_version: { type: string, pattern: "factor-set-<hash12>", description: "§103 因子集版本" }
        market_snapshot_id: { type: string, description: "quant 市场快照引用（§9）" }
        data_version: string
        data_snapshot_id: string
        as_of: string
        scores:
          type: array
          items:
            symbol: string
            alpha_score: number
            score: number
            rank: { type: integer, description: "1 = 最高分" }
            coverage: { type: number, description: "详细修改方案 §12：因子数据覆盖率" }
            confidence: { type: number, description: "详细修改方案 §12：置信度（coverage 驱动）" }
            factor_contributions:
              type: array
              items: { factor_id: string, contribution: number }
            evidence:
              type: array
              items: { factor_id: string, contribution: number }
        items: { type: array, description: "兼容旧消费方的精简结构 {symbol, score}" }
  - name: create_mining_job
    method: POST
    path: /api/v1/mining/jobs
    idempotency: Idempotency-Key header（§33）
  - name: evaluate_factor
    method: POST
    path: /api/v1/factors/evaluate
  - name: health_version
    method: GET
    path: /health/version
research_integrity:
  # §13 / §78 Final OOS 真隔离（收尾文档 §14-§25 强化）
  - Candidate Search 只能访问 Discovery Snapshot
  - Preliminary Fitness / FDR / PBO / DSR / Recent Alpha 全部不得引用 Final OOS
  - Generation Loop 禁止 freeze_candidate / 评估 Final OOS（只产生 discovery 证据）
  - Discovery Gate（签名无 final_oos）→ Finalist Selection（默认 1 个，cohort ≤ 3）
  - ResearchExperiment 状态机：CREATED → DISCOVERY_RUNNING → DISCOVERY_COMPLETED →
    FINALIST_SELECTED → FROZEN → OOS_AUTHORIZED → OOS_EVALUATED → COMPLETED
  - FinalOosEvaluationService 独立执行、一次性使用；未冻结/未授权禁止评估
  - OOS 结果反馈进入搜索 => OOS 区间立即失效（OOS_WINDOW_INVALIDATED / OOS_INVALIDATED）
  - Experiment 必须分别保存 discovery_snapshot_id / final_oos_snapshot_id（§86）
  - forward return 不得越过评估窗口边界（防未来函数）
factor_status:
  # 详细修改方案 §10：研究治理状态机（PAPER_ELIGIBLE 弃用，交易执行已迁往 Quant）
  - DRAFT
  - DISCOVERY_CANDIDATE
  - DISCOVERY_PASSED
  - FINALIST
  - OOS_PASSED
  - OOS_FAILED
  - PROMOTED
  - ACTIVE
  - DEGRADED
  - RETIRED
  - INVALIDATED
metric_scope:
  # 详细修改方案 P0-1：本服务收益指标均为研究代理，权威回测只来自 quant backtest.v1
  value: RESEARCH_PROXY
  forbidden_fields: [backtest_return, strategy_return, portfolio_return]
research_governance_engines:
  # 详细修改方案 P1：统计治理引擎
  - multiple_testing (Bonferroni / Holm / BH-FDR)
  - sharpe_validation (PSR / DSR)
  - pbo (CSCV)
  - bootstrap (moving block / stationary)
  - neutralization (industry / market_cap / beta / volatility / liquidity)
  - cost_sensitivity (5/10/20/50bps + break-even)
  - stability (regime / subperiod / sign consistency)
promotion_gate_v2:
  # 详细修改方案 §14：八道门，禁止只返回 boolean
  gates: [DATA_QUALITY, DISCOVERY_IC, STABILITY, MULTIPLE_TESTING, FINAL_OOS,
          COST_SENSITIVITY, EXPOSURE_NEUTRALIZATION, RESEARCH_GOVERNANCE]
  response: { passed: boolean, failed_gates: [{ gate: string, reason: string }] }
tradability_assessment:
  artifact_type: TradabilityAssessmentArtifact
  required_for_formal_promotion: true
  identity: [artifact_id, factor_artifact_id, market_snapshot_id, execution_model_version,
             execution_calibration_checksum]
  metrics: [gross_metrics, net_metrics, turnover, ic_decay, holding_period_sensitivity,
            limit_hit_rate, halt_exposure, participation_rate, capacity_curve,
            neutralized_contribution]
  assumptions: [annualization_days, rebalance, horizon_days, rounding, cash_assumption, fillability]
factor_set:
  # 详细修改方案 §11：Agent 使用 factor_set_id 而非临时查询 active factors
  identity: [factor_set_id, factor_set_version, factor_ids, factor_versions, weights,
             research_experiment_ids, promotion_policy_version, valid_from, valid_to, status]
paper_deprecation:
  # 收尾文档 §26：Paper 端点为兼容 proxy，内部转发 quant trading.v1
  endpoints: [/api/v1/paper/orders/generate, /api/v1/paper/run, /api/v1/paper/state, /api/v1/paper/equity, /api/v1/paper/replay]
  headers: { Deprecation: "true", X-Deprecated-By: quant/trading.v1 }
  authority_switch: FACTOR_PAPER_AUTHORITY=quant
dependencies:
  allowed: [quant HTTP, stock_content HTTP, Model API, PostgreSQL]
  forbidden: [stock_agent, quant Python import, stock_content Python import]
error_codes: [FACTOR_NOT_PROMOTED, DATA_NOT_READY, SNAPSHOT_NOT_FOUND]
