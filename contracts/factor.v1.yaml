# factor.v1 Contract（设计文档 §14）
# Producer: stock_factor   Consumers: stock_agent（FactorSpecialist）
contract_version: factor.v1
service: stock_factor
endpoints:
  - name: list_factors
    method: GET
    path: /api/v1/factors
  - name: get_factor
    method: GET
    path: /api/v1/factors/{factor_id}
    returns: [formula, status, RankIC, ICIR, OOS, lifecycle, capacity, exposure]
  - name: alpha_score
    method: POST
    path: /api/v1/alpha/score
    description: On-demand Alpha Score（§14.2）
    request:
      symbols: { type: array, items: string, required: true }
      as_of: { type: date, required: false }
      factor_set: { type: string, default: production }
    response:
      data:
        factor_set_version: { type: string, pattern: "factor-set-<hash12>", description: "§103 因子集版本" }
        market_snapshot_id: { type: string, description: "quant 市场快照引用（§9）" }
        data_version: string
        data_snapshot_id: string
        as_of: string
        scores:
          type: array
          items:
            symbol: string
            score: number
            rank: { type: integer, description: "1 = 最高分" }
            evidence:
              type: array
              items: { factor_id: string, contribution: number }
        items: { type: array, description: "兼容旧消费方的精简结构 {symbol, score}" }
  - name: create_mining_job
    method: POST
    path: /api/v1/mining/jobs
    idempotency: Idempotency-Key header（§33）
  - name: evaluate_factor
    method: POST
    path: /api/v1/factors/evaluate
  - name: health_version
    method: GET
    path: /health/version
research_integrity:
  # §13 / §78 Final OOS 真隔离（收尾文档 §14-§25 强化）
  - Candidate Search 只能访问 Discovery Snapshot
  - Preliminary Fitness / FDR / PBO / DSR / Recent Alpha 全部不得引用 Final OOS
  - Generation Loop 禁止 freeze_candidate / 评估 Final OOS（只产生 discovery 证据）
  - Discovery Gate（签名无 final_oos）→ Finalist Selection（默认 1 个，cohort ≤ 3）
  - ResearchExperiment 状态机：CREATED → DISCOVERY_RUNNING → DISCOVERY_COMPLETED →
    FINALIST_SELECTED → FROZEN → OOS_AUTHORIZED → OOS_EVALUATED → COMPLETED
  - FinalOosEvaluationService 独立执行、一次性使用；未冻结/未授权禁止评估
  - OOS 结果反馈进入搜索 => OOS 区间立即失效（OOS_WINDOW_INVALIDATED / OOS_INVALIDATED）
  - Experiment 必须分别保存 discovery_snapshot_id / final_oos_snapshot_id（§86）
  - forward return 不得越过评估窗口边界（防未来函数）
factor_status:
  # 收尾文档 §27：Mining 不直接进入 PAPER_TRADING（Paper Authority 属于 quant）
  - CANDIDATE
  - DISCOVERY_PASSED
  - OOS_FAILED
  - PAPER_ELIGIBLE
  - RETIRED
paper_deprecation:
  # 收尾文档 §26：Paper 端点为兼容 proxy，内部转发 quant trading.v1
  endpoints: [/api/v1/paper/orders/generate, /api/v1/paper/run, /api/v1/paper/state, /api/v1/paper/equity, /api/v1/paper/replay]
  headers: { Deprecation: "true", X-Deprecated-By: quant/trading.v1 }
  authority_switch: FACTOR_PAPER_AUTHORITY=quant
dependencies:
  allowed: [quant HTTP, stock_content HTTP, Model API, PostgreSQL]
  forbidden: [stock_agent, quant Python import, stock_content Python import]
error_codes: [FACTOR_NOT_PROMOTED, DATA_NOT_READY, SNAPSHOT_NOT_FOUND]
