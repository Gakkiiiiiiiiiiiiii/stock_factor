services:
  stock-factor:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy

  stock-factor-worker:
    build: .
    env_file:
      - path: .env
        required: false
    command: ["stock-factor-worker"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_factor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - factor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_factor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factor-postgres:
